name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-escript:
    name: Build escript
    runs-on: ubuntu-latest
    steps:
      - name: Check out mxpak
        uses: actions/checkout@v4
        with:
          path: mxpak

      - name: Check out local GleamRover dependency
        uses: actions/checkout@v4
        with:
          repository: glendix-labs/GleamRover
          path: gleam_rover

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1"
          gleam-version: "1.17.0"
          rebar3-version: "3"

      - name: Download dependencies
        working-directory: mxpak
        run: gleam deps download

      - name: Build project
        working-directory: mxpak
        run: gleam build

      - name: Build escript
        working-directory: mxpak
        run: |
          gleam run -m gleescript
          mv mxpak mxp

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mxpak/mxp
            mxpak/install.sh
            mxpak/install.ps1
          body: |
            ## Install

            **macOS / Linux**

            ```sh
            curl -fsSL https://github.com/glendix-labs/mxpak/releases/latest/download/install.sh | sh
            ```

            **Windows (PowerShell)**

            ```powershell
            iwr -useb https://github.com/glendix-labs/mxpak/releases/latest/download/install.ps1 | iex
            ```

            Requires Erlang/OTP 26+ on PATH. See README for details.
