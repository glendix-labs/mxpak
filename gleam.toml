name = "mxpak"
version = "1.0.0"
gleam = ">= 1.17.0"
target = "erlang"
description = "Mendix widget .mpk package manager — search, resolve, download, cache"
licences = ["MIT"]
repository = { type = "github", user = "glendix-labs", repo = "mxpak" }

[dependencies]
gleam_stdlib = ">= 1.0.3 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
tom = ">= 2.1.0 and < 3.0.0"
simplifile = ">= 2.6.0 and < 3.0.0"
glendam = { path = "../glendam" }
shore = ">= 1.3.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
gleam_regexp = ">= 1.1.1 and < 2.0.0"

[dev_dependencies]
gleescript = ">= 1.5.2 and < 2.0.0"
gleeunit = ">= 1.11.0 and < 2.0.0"
